<html lang="it">
<head>
<meta charset="utf-8">

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}[hidden]{display:none!important}*{box-sizing:border-box}</style>
<title>MOVITE</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600&display=swap">
<style>
/* Layout: blue header with pill fields, light card stack below; full-screen stop picker */
:root{--blue:#c80815;--blue2:#a50611;--pill:rgba(255,255,255,.14);--pillb:rgba(255,255,255,.22);--bg:#f4f5f7;--card:#fff;--fg:#123;--muted:#6b7a88;--line:#e3e8ee;--beta:#fff6dc;--betab:#f1d77c;--brown:#7a4419;--font:"Lexend",system-ui,sans-serif;color-scheme:light}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--blue)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:560px;margin:0 auto}
header{background:var(--blue);color:#fff;padding-block:10px 22px;box-shadow:0 4px 10px rgba(0,0,0,.12)}
.bar{display:flex;align-items:center;justify-content:space-between;height:52px}
.logo{font-weight:600;font-size:22px;letter-spacing:.5px;display:flex;align-items:center;gap:10px}.logo img{border-radius:9px;border:1.5px solid rgba(255,255,255,.7)}
.ibtn{background:none;border:0;color:inherit;font:inherit;cursor:pointer;padding:8px;border-radius:10px;display:grid;place-items:center}
.ibtn:focus-visible,.field:focus-visible,.row:focus-visible{outline:2px solid #fff;outline-offset:2px}
.fields{display:grid;gap:12px;margin-top:8px}
.field{display:flex;align-items:center;gap:16px;background:var(--pill);border:1.5px solid var(--pillb);border-radius:30px;padding:0 22px;height:56px;color:#fff;font:inherit;font-size:17px;letter-spacing:.6px;text-align:left;cursor:pointer;width:100%;min-width:0}
.field span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:300}
.field.set span{font-weight:500}
.field input{background:none;border:0;color:#fff;font:inherit;font-weight:500;width:5.5em}
.swap{position:relative}
.swapbtn{position:absolute;right:14px;top:50%;transform:translateY(-50%);background:var(--blue2);border:1.5px solid var(--pillb);color:#fff;width:40px;height:40px;border-radius:50%;cursor:pointer;display:grid;place-items:center}
main{padding-block:20px 40px;display:grid;gap:16px}
.beta{display:flex;gap:14px;align-items:center;background:var(--beta);border:1.5px solid var(--betab);border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.35}
.beta b{font-weight:500}
.beta .act{margin-left:auto;background:var(--brown);color:#fff;border:0;border-radius:10px;padding:10px 14px;font:inherit;font-size:14px;cursor:pointer;white-space:nowrap}
.card{background:var(--card);border-radius:22px;box-shadow:0 2px 10px rgba(0,0,0,.08);padding:18px 22px}
.ch{display:flex;align-items:center;gap:12px;color:var(--blue);font-weight:500;letter-spacing:1px;text-transform:uppercase;font-size:15px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.fav{display:grid;gap:8px;padding-block:14px;border-bottom:1px solid var(--line);cursor:pointer}
.fav:last-child{border-bottom:0}
.fav .a{display:flex;gap:12px;align-items:center;color:var(--blue);font-weight:600;text-transform:uppercase}
.chip{background:var(--blue);color:#fff;border-radius:10px;padding:5px 12px;font-weight:400}
.empty{color:var(--muted);font-size:14px;line-height:1.5;padding-top:12px}
.res{display:grid}
.trip{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding-block:14px;border-bottom:1px solid var(--line)}
.lns{display:flex;flex-direction:column;gap:4px}.ln.nav{border-radius:50px}.md{margin-left:auto;font-size:12px;color:var(--muted);font-weight:400;letter-spacing:0;white-space:nowrap}
.trip:last-child{border-bottom:0}
.ln{min-width:48px;text-align:center;border-radius:10px;padding:7px 8px;font-weight:600;color:#fff;background:var(--blue)}
.tt{font-size:22px;font-weight:500;font-variant-numeric:tabular-nums}
.tt small{font-size:15px;color:var(--muted);font-weight:400}
.hs{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mid{min-width:0}
.wait{font-size:14px;color:var(--blue);font-weight:500;text-align:right;font-variant-numeric:tabular-nums}
.more{background:none;border:1.5px solid var(--blue);color:var(--blue);border-radius:20px;padding:10px;font:inherit;cursor:pointer;margin-top:12px;width:100%}
/* picker */
#picker{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
#picker .ph{background:var(--blue);color:#fff;display:flex;align-items:center;gap:12px;height:60px;font-size:20px;letter-spacing:1px;text-transform:uppercase;padding-left:max(8px,env(safe-area-inset-left,0px))}
.pbody{flex:1;display:flex;min-height:0}
.az{width:52px;background:#e04b55;display:flex;flex-direction:column;overflow-y:auto;flex-shrink:0;padding-left:env(safe-area-inset-left,0px)}
.az button{flex:1;min-height:34px;border:0;border-bottom:1px solid rgba(255,255,255,.35);background:none;color:#fff;font:inherit;font-weight:500;font-size:16px;cursor:pointer}
.plist{flex:1;overflow-y:auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 40px 16px;min-width:0}
.search{width:100%;height:50px;border-radius:25px;border:0;background:var(--card);box-shadow:0 2px 8px rgba(0,0,0,.1);padding:0 20px;font:inherit;font-size:16px;color:var(--fg);letter-spacing:.5px}
.tabs{display:flex;justify-content:space-around;margin:16px 0 8px}
.tabs button{border:0;background:none;font:inherit;font-size:17px;color:var(--muted);padding:8px 22px;border-radius:20px;cursor:pointer}
.tabs button.on{background:var(--blue);color:#fff;font-weight:600;letter-spacing:1px}
.letter{text-align:right;font-size:32px;font-weight:500;color:var(--muted);margin:10px 4px 2px}
.row{display:flex;align-items:center;gap:16px;width:100%;background:var(--card);border:0;border-radius:24px;box-shadow:0 2px 6px rgba(0,0,0,.09);padding:14px 18px;margin-bottom:10px;font:inherit;font-size:17px;color:var(--blue);letter-spacing:.8px;font-weight:500;cursor:pointer;text-align:left}
.row .h{color:#bbc4cc;flex-shrink:0;background:none;border:0;cursor:pointer;padding:0;display:grid}
.row .h.on{color:#e2455a}
.row span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.status{font-size:13px;color:var(--muted);text-align:center;line-height:1.5}
.status button{background:none;border:0;color:var(--blue);font:inherit;text-decoration:underline;cursor:pointer}
@media (prefers-reduced-motion:no-preference){.row,.field{transition:transform .1s}.row:active,.field:active{transform:scale(.98)}}
</style>

</head>
<body>
<header><div class="wrap">
  <div class="bar"><span class="ibtn" aria-hidden="true"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg></span>
  <span class="logo"><img src="icon-64.png" alt="" width="34" height="34">MOVITE</span>
  <button class="ibtn" id="favBtn" title="Salva nei preferiti" aria-label="Salva percorso nei preferiti"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-4.5-9.5-9A5.5 5.5 0 0 1 12 6a5.5 5.5 0 0 1 9.5 6c-2.5 4.5-9.5 9-9.5 9z"/></svg></button></div>
  <div class="fields">
    <div class="swap">
    <button class="field" id="fFrom"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s7-6 7-12a7 7 0 0 0-14 0c0 6 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/></svg><span>Partenza</span></button>
    </div>
    <div class="swap">
    <button class="field" id="fTo"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 21V4h11l-2 4 2 4H5"/></svg><span>Arrivo</span></button>
    <button class="swapbtn" id="swap" aria-label="Inverti partenza e arrivo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 4v16M3 8l4-4 4 4M17 20V4M13 16l4 4 4-4"/></svg></button>
    </div>
    <label class="field" for="when"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span id="dayLbl" style="font-weight:500">Oggi</span><span>alle</span><input type="time" id="when"></label>
  </div>
</div></header>

<main class="wrap">
  <div class="beta" id="dataBox"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 3h6M10 3v6L4 20h16L14 9V3"/></svg><div id="dataTxt"><b>Dati di esempio.</b> Carica il GTFS bus ACTV per gli orari reali.</div><button class="act" id="loadBtn" hidden>Carica</button><input type="file" id="file" accept=".zip" hidden></div>
  <section class="card" id="resCard" hidden><div class="ch"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="3" width="16" height="15" rx="3"/><path d="M4 11h16M8 21l1-3M16 21l-1-3"/></svg><span id="resTitle">Prossimi bus</span></div><div class="res" id="res"></div></section>
  <section class="card"><div class="ch"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-4.5-9.5-9A5.5 5.5 0 0 1 12 6a5.5 5.5 0 0 1 9.5 6c-2.5 4.5-9.5 9-9.5 9z"/></svg>I tuoi percorsi preferiti</div><div id="favs"></div></section>
  <p class="status" id="status"></p>
</main>

<div id="picker" hidden>
  <div class="ph"><button class="ibtn" id="pBack" aria-label="Indietro"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M20 12H5M11 6l-6 6 6 6"/></svg></button><span id="pTitle">Partenza</span></div>
  <div class="pbody"><nav class="az" id="az"></nav>
  <div class="plist" id="plist"><input class="search" id="q" placeholder="Cerca" autocomplete="off"><div class="tabs" id="tabs"><button data-t="all" class="on">Tutte</button><button data-t="fav">Preferiti</button><button data-t="rec">Recenti</button></div><div id="rows"></div></div></div>
</div>

<script>
const $=id=>document.getElementById(id);
const S={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let D=null; // {names:[], byName:Map(name->[[trip,seq,secs]]), trips:[[short,headsign,service,color]], active(dateStr)->Set}
let st={from:S.get('from',null),to:S.get('to',null),tab:'all',which:'from',limit:12};
const hm=s=>{s=((s%86400)+86400)%86400;return String(Math.floor(s/3600)).padStart(2,'0')+':'+String(Math.floor(s/60)%60).padStart(2,'0')};
const toS=t=>{const p=t.split(':');return +p[0]*3600+ +p[1]*60+ +(p[2]||0)};
const ymd=d=>d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');

const norm=(n,m)=>{n=n.replace(/"/g,'').replace(/\s+/g,' ').trim();if(m=='n')n=n.replace(/ [A-H]$/,'');return /^P\.le Roma\b/.test(n)||n=='VENEZIA'||n=='VENEZIA CORSIA C'?'Piazzale Roma':n};
const PM="Liberta' Porto Marghera",FS=[PM,'Piazzale Roma','Rialto'],FR=[[PM,'Piazzale Roma'],['Piazzale Roma',PM]];
function build(srcs){const trips=[],byName=new Map(),modes=new Map(),acts=[];let end='99999999';
  for(const [c,m] of srcs){const nm=c.names.map(x=>norm(x,m)),pn=c.pats.map(([ns])=>ns.map(i=>nm[i]));if(c.end&&c.end<end)end=c.end;
    c.trips.forEach(([r,h,s,p,t0])=>{const ti=trips.length,off=c.pats[p][1];trips.push([c.routes[r][0],norm(c.hs[h],m),m+c.svc[s],c.routes[r][1],m,pn[p],off,t0]);
      pn[p].forEach((k,i)=>{let a=byName.get(k);if(!a){byName.set(k,a=[]);modes.set(k,new Set())}a.push([ti,i,(t0+off[i])*60]);modes.get(k).add(m)})});
    const ex={};for(const [id,d,t] of c.ex)(ex[d]??=[]).push([id,t]);
    acts.push(ds=>{const w=new Date(+ds.slice(0,4),+ds.slice(4,6)-1,+ds.slice(6)).getDay(),s=new Set();for(const [id,a,b,mm] of c.cal)if(ds>=a&&ds<=b&&mm[w]=='1')s.add(id);for(const [id,t] of ex[ds]||[])t=='1'?s.add(id):s.delete(id);return [...s].map(x=>m+x)})}
  for(const a of byName.values())a.sort((x,y)=>x[2]-y[2]);
  return {names:[...byName.keys()].sort((a,b)=>a.localeCompare(b,'it')),byName,modes,trips,end,active:ds=>new Set(acts.flatMap(f=>f(ds)))}}
/* ---------- GTFS loader ---------- */
function rows(txt){
  const lines=txt.split(/\r?\n/);const head=split(lines[0].replace(/^﻿/,''));const ix={};head.forEach((h,i)=>ix[h.trim()]=i);
  return {ix,lines:lines.slice(1).filter(l=>l)};
}
function split(l){if(l.indexOf('"')<0)return l.split(',');const o=[];let c='',q=false;for(let i=0;i<l.length;i++){const ch=l[i];if(q){if(ch=='"'){if(l[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}else if(ch=='"')q=true;else if(ch==','){o.push(c);c=''}else c+=ch}o.push(c);return o}
async function parseZip(blob){
  status('Lettura del file GTFS…');
  const z=await JSZip.loadAsync(blob);const f=n=>z.file(n)?z.file(n).async('string'):Promise.resolve('');
  const stopName={},routes={},trips=[],tripIx={};
  let r=rows(await f('stops.txt'));for(const l of r.lines){const c=split(l);stopName[c[r.ix.stop_id]]=c[r.ix.stop_name].trim()}
  r=rows(await f('routes.txt'));for(const l of r.lines){const c=split(l);const col=c[r.ix.route_color];routes[c[r.ix.route_id]]=[c[r.ix.route_short_name]||c[r.ix.route_long_name],col&&col.length==6?'#'+col:'#0a96e0']}
  r=rows(await f('trips.txt'));for(const l of r.lines){const c=split(l);const ro=routes[c[r.ix.route_id]]||['?','#0a96e0'];tripIx[c[r.ix.trip_id]]=trips.length;trips.push([ro[0],(c[r.ix.trip_headsign]||'').trim(),c[r.ix.service_id],ro[1]])}
  status('Elaborazione orari… (può richiedere qualche secondo)');await new Promise(r=>setTimeout(r,30));
  const byName=new Map();
  r=rows(await f('stop_times.txt'));const {ix}=r;
  for(const l of r.lines){const c=split(l);const ti=tripIx[c[ix.trip_id]];if(ti===undefined)continue;const t=c[ix.departure_time]||c[ix.arrival_time];if(!t)continue;const n=stopName[c[ix.stop_id]];if(!n)continue;
    let a=byName.get(n);if(!a)byName.set(n,a=[]);a.push([ti,+c[ix.stop_sequence],toS(t)])}
  const cal=[],ex={};
  r=rows(await f('calendar.txt'));for(const l of r.lines){const c=split(l);cal.push([c[r.ix.service_id],c[r.ix.start_date],c[r.ix.end_date],['sunday','monday','tuesday','wednesday','thursday','friday','saturday'].map(d=>c[r.ix[d]]=='1')])}
  r=rows(await f('calendar_dates.txt'));for(const l of r.lines){const c=split(l);(ex[c[r.ix.date]]??=[]).push([c[r.ix.service_id],c[r.ix.exception_type]])}
  const active=ds=>{const d=new Date(+ds.slice(0,4),+ds.slice(4,6)-1,+ds.slice(6));const s=new Set();for(const [id,a,b,w] of cal)if(ds>=a&&ds<=b&&w[d.getDay()])s.add(id);for(const [id,t] of ex[ds]||[])t=='1'?s.add(id):s.delete(id);return s};
  return {names:[...byName.keys()].sort((a,b)=>a.localeCompare(b,'it')),byName,trips,active,demo:false};
}
const db=()=>new Promise((ok,ko)=>{try{const q=indexedDB.open('chebus',1);q.onupgradeneeded=()=>q.result.createObjectStore('f');q.onsuccess=()=>ok(q.result);q.onerror=ko}catch(e){ko(e)}});
async function idb(op,v){try{const d=await db();return await new Promise(ok=>{const t=d.transaction('f',op?'readwrite':'readonly').objectStore('f');const q=op?t.put(v,'gtfs'):t.get('gtfs');q.onsuccess=()=>ok(q.result);q.onerror=()=>ok(null)})}catch(e){return null}}

/* ---------- search ---------- */
function plan(A,B,t0,act){
  const T=D.trips,tt=(ti,i)=>(T[ti][7]+T[ti][6][i])*60,Bt=new Map();
  for(const [ti,sq,t] of D.byName.get(B))if(act.has(T[ti][2]))(Bt.get(ti)||Bt.set(ti,[]).get(ti)).push([sq,t]);
  const reach=(ti,s)=>{const l=Bt.get(ti);if(!l)return null;let r=null;for(const x of l)if(x[0]>s&&(!r||x[0]<r[0]))r=x;return r};
  const opts=[],firsts=[];
  for(const [ti,i,t] of D.byName.get(A)){if(t<t0||!act.has(T[ti][2]))continue;const r=reach(ti,i);if(r)opts.push([[ti,i,r[0],t,r[1]]]);if(t<t0+3*3600&&firsts.length<80)firsts.push([ti,i,t])}
  for(const [ti,i,t] of firsts){let best=null;const ns=T[ti][5];
    for(let k=i+1;k<ns.length;k++){const X=ns[k];if(X==B)break;if(X==A)continue;const ta=tt(ti,k),E=D.byName.get(X);
      let lo=0,hi=E.length;while(lo<hi){const md=lo+hi>>1;E[md][2]<ta+180?lo=md+1:hi=md}
      for(let j=lo,n=0;j<E.length&&n<300;j++,n++){const [t2,s2,d2]=E[j];if(t2==ti||!act.has(T[t2][2]))continue;if(T[t2][4]!=T[ti][4]&&d2<ta+300)continue;if(best&&d2>=best[1][4])break;const r=reach(t2,s2);if(r){if(!best||r[1]<best[1][4])best=[[ti,i,k,t,ta],[t2,s2,r[0],d2,r[1]]];break}}}
    if(best)opts.push(best)}
  opts.sort((x,y)=>y[0][3]-x[0][3]||x.length-y.length);let m=Infinity;const keep=[];
  for(const o of opts){const ar=o[o.length-1][4];if(ar<m){keep.push(o);m=ar}}
  return keep.reverse()}
function search(){
  const card=$('resCard');if(!st.from||!st.to||!D){card.hidden=true;return}
  card.hidden=false;$('resTitle').textContent=st.from+' → '+st.to;
  if(!D.byName.has(st.from)||!D.byName.has(st.to)){$('res').innerHTML='<p class="empty">Una delle fermate non esiste in questi dati.</p>';return}
  if(st.from==st.to){$('res').innerHTML='<p class="empty">Partenza e arrivo coincidono.</p>';return}
  const [h,m]=($('when').value||'00:00').split(':');const list=plan(st.from,st.to,h*3600+m*60,D.active(ymd(new Date())));
  if(!list.length){$('res').innerHTML='<p class="empty">Nessuna soluzione con al massimo un cambio per il resto della giornata.</p>';return}
  const now=new Date(),nowS=now.getHours()*3600+now.getMinutes()*60,T=D.trips;
  const badge=ti=>`<span class="ln${T[ti][4]=='n'?' nav':''}" style="background:${T[ti][3]}">${esc(T[ti][0])}</span>`;
  $('res').innerHTML=list.slice(0,st.limit).map(o=>{const f=o[0],l=o[o.length-1],w=Math.round((f[3]-nowS)/60);
    const sub=o.length==1?`dir. ${esc(T[f[0]][1])}`:`cambio a ${esc(T[f[0]][5][f[2]])} · ${hm(f[4])} → ${hm(o[1][3])}`;
    return `<div class="trip"><div class="lns">${o.map(x=>badge(x[0])).join('')}</div><div class="mid"><div class="tt">${hm(f[3])} <small>→ ${hm(l[4])} · ${Math.round((l[4]-f[3])/60)} min</small></div><div class="hs">${sub}</div></div><div class="wait">${w>=0&&w<120?(w==0?'ora':'tra '+w+'′'):''}</div></div>`}).join('')+
    (list.length>st.limit?`<button class="more" id="more">Mostra altri ${list.length-st.limit}</button>`:'');
  const mb=$('more');if(mb)mb.onclick=()=>{st.limit+=20;search()};
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- UI ---------- */
function render(){
  for(const [k,el,ph] of [['from','fFrom','Partenza'],['to','fTo','Arrivo']]){const b=$(el);b.classList.toggle('set',!!st[k]);b.querySelector('span').textContent=st[k]||ph}
  const favs=S.get('favR',FR);
  $('favs').innerHTML=favs.length?favs.map((f,i)=>`<div class="fav" data-i="${i}" tabindex="0"><div class="a"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s7-6 7-12a7 7 0 0 0-14 0c0 6 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/></svg>${esc(f[0])}</div><div class="a"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12h16M14 6l6 6-6 6"/></svg><span class="chip">${esc(f[1])}</span></div></div>`).join(''):'<p class="empty">Scegli partenza e arrivo, poi tocca il cuore in alto per salvare il percorso.</p>';
  document.querySelectorAll('.fav').forEach(el=>el.onclick=()=>{const f=favs[el.dataset.i];st.from=f[0];st.to=f[1];save();render()});
  const e=D.end.slice(6)+'/'+D.end.slice(4,6)+'/'+D.end.slice(0,4);$('dataTxt').innerHTML='<b>Orari ACTV bus e battelli.</b> '+D.names.length+' fermate, validi fino al '+e+'.';
  st.limit=12;search();
}
const save=()=>{S.set('from',st.from);S.set('to',st.to)};
function status(t){$('status').innerHTML=t||''}
function openPicker(which){st.which=which;$('pTitle').textContent=which=='from'?'Partenza':'Arrivo';$('q').value='';$('picker').hidden=false;drawRows();setTimeout(()=>$('q').focus(),50)}
function drawRows(){
  const q=$('q').value.trim().toLowerCase();const favS=S.get('favS',FS),rec=S.get('rec',[]);
  let list=st.tab=='fav'?favS.slice().sort():st.tab=='rec'?rec:D.names;
  if(q)list=list.filter(n=>n.toLowerCase().includes(q));
  let h='',last='';const letters=[];
  for(const n of list.slice(0,600)){const L=n[0].toUpperCase();if(st.tab=='all'&&L!=last){h+=`<div class="letter" id="L-${L}">${esc(L)}</div>`;letters.push(L);last=L}
    h+=`<div class="row" role="button" tabindex="0" data-n="${esc(n)}"><button class="h${favS.includes(n)?' on':''}" aria-label="Preferito"><svg width="24" height="24" viewBox="0 0 24 24" fill="${favS.includes(n)?'currentColor':'none'}" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-4.5-9.5-9A5.5 5.5 0 0 1 12 6a5.5 5.5 0 0 1 9.5 6c-2.5 4.5-9.5 9-9.5 9z"/></svg></button><span>${esc(n)}</span><small class="md">${[...D.modes.get(n)||[]].map(x=>x=='n'?'battello':'bus').join(' · ')}</small></div>`}
  $('rows').innerHTML=h||'<p class="empty">Nessuna fermata.</p>';
  $('az').innerHTML=`<button data-l="q" aria-label="Cerca">⌕</button>`+letters.map(l=>`<button data-l="${esc(l)}">${esc(l)}</button>`).join('');
}
$('rows').onclick=e=>{const r=e.target.closest('.row');if(!r)return;const n=r.dataset.n;
  if(e.target.closest('.h')){let f=S.get('favS',FS);f=f.includes(n)?f.filter(x=>x!=n):[...f,n];S.set('favS',f);drawRows();return}
  st[st.which]=n;S.set('rec',[n,...S.get('rec',[]).filter(x=>x!=n)].slice(0,15));save();$('picker').hidden=true;render()};
$('rows').onkeydown=e=>{if(e.key=='Enter')e.target.click()};
$('az').onclick=e=>{const l=e.target.dataset.l;if(!l)return;if(l=='q'){$('q').focus();return}const el=$('L-'+l);if(el)el.scrollIntoView({block:'start'})};
$('tabs').onclick=e=>{const t=e.target.dataset.t;if(!t)return;st.tab=t;[...$('tabs').children].forEach(b=>b.classList.toggle('on',b.dataset.t==t));drawRows()};
$('q').oninput=drawRows;$('pBack').onclick=()=>$('picker').hidden=true;
$('fFrom').onclick=()=>openPicker('from');$('fTo').onclick=()=>openPicker('to');
$('swap').onclick=()=>{[st.from,st.to]=[st.to,st.from];save();render()};
$('when').onchange=()=>{st.limit=12;search()};
$('favBtn').onclick=()=>{if(!st.from||!st.to)return;let f=S.get('favR',FR);if(!f.some(x=>x[0]==st.from&&x[1]==st.to))f.unshift([st.from,st.to]);S.set('favR',f);render()};
$('loadBtn').onclick=()=>$('file').click();
$('file').onchange=async e=>{const fl=e.target.files[0];if(!fl)return;try{D=await parseZip(fl);await idb(1,fl);status('');render()}catch(err){status('Il file non sembra un GTFS valido: scegli lo zip "automobilistico" scaricato dagli open data ACTV.')}};
document.addEventListener('keydown',e=>{if(e.key=='Escape')$('picker').hidden=true});

(async()=>{const n=new Date();$('when').value=hm(n.getHours()*3600+n.getMinutes()*60);
  try{const j=await (await fetch('data.json',{cache:'no-cache'})).json();D=build([[j.aut,'b'],[j.nav,'n']])}catch(e){status('Impossibile caricare gli orari. Controlla la connessione e riapri l\'app.');return}{const fs=S.get('favS',null);if(fs&&!S.get('m1',0)){if(!fs.includes('Rialto'))S.set('favS',[...fs,'Rialto']);S.set('m1',1)}}if(!st.from||!D.byName.has(st.from)||!D.byName.has(st.to)){st.from=PM;st.to='Piazzale Roma'}render();
  
  })();
</script>

<script>if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{})</script>
</body>
</html>
